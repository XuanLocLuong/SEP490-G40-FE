name: Build and Push to Registry

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login localhost:5000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="pr-${{ github.event.pull_request.number }}"
          else
            BRANCH=${GITHUB_REF#refs/heads/}
          fi
          COMMIT_SHA=${GITHUB_SHA::7}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "image=localhost:5000/sep490-g40-fe" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          SHA="${{ steps.meta.outputs.sha }}"

          docker build \
            --tag "$IMAGE:$BRANCH-$SHA" \
            --tag "$IMAGE:$BRANCH-latest" \
            .

          if [ "${{ github.event_name }}" = "push" ]; then
            docker tag "$IMAGE:$BRANCH-$SHA" "$IMAGE:latest"
          fi

      - name: Push to local registry
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          SHA="${{ steps.meta.outputs.sha }}"

          docker push "$IMAGE:$BRANCH-$SHA"
          docker push "$IMAGE:$BRANCH-latest"

          if [ "${{ github.event_name }}" = "push" ]; then
            docker push "$IMAGE:latest"
          fi

      - name: Clean up old images
        run: |
          docker image prune -f
