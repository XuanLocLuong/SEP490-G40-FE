name: Build and Push to Registry

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login localhost:5000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Extract metadata
        id: meta
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          COMMIT_SHA=${GITHUB_SHA::7}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "image=localhost:5000/sep490-g40-fe" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }} \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}-latest \
            --tag ${{ steps.meta.outputs.image }}:latest \
            .

      - name: Push to local registry
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}-latest
          docker push ${{ steps.meta.outputs.image }}:latest

      - name: Clean up old images
        run: |
          docker image prune -f
